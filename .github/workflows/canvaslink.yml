name: CanvasLink alpha

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:canvaslink
      - run: npm run typecheck

  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: node integrations/canvaslink/scripts/build-android.cjs
      - name: Upload alpha APK (ephemeral CI development signature)
        uses: actions/upload-artifact@v4
        with:
          name: CanvasLink-debug
          path: integrations/canvaslink/dist/CanvasLink-debug.apk
          retention-days: 30
